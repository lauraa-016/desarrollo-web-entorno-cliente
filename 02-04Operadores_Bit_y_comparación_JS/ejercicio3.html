<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Operadores booleanos</title>
</head>
<body>
    <h1>Operadores booleanos en JavaScript</h1>

    <table border="1">
        <tr>
            <th>Sintaxis</th>
            <th>Nombre</th>
            <th>Ejemplo</th>
        </tr>
        <tr>
            <td>&amp;&amp;</td>
            <td>AND lógico (Y)</td>
            <td>edad &gt;= 18 &amp;&amp; tieneDNI</td>
        </tr>
        <tr>
            <td>||</td>
            <td>OR lógico (O)</td>
            <td>esFestivo || esFinDeSemana</td>
        </tr>
        <tr>
            <td>!</td>
            <td>NOT lógico (NO)</td>
            <td>!estaLloviendo</td>
        </tr>
    </table>
</body>
</html>
