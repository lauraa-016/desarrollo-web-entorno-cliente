<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6 - Operadores booleanos</title>
</head>
<body>
    <h1>Ejemplos de operadores booleanos</h1>

    <script>
        let a = true;
        let b = false;

        document.write("AND: " + (a && b) + "<br>");
        document.write("OR: " + (a || b) + "<br>");
        document.write("NOT: " + (!a) + "<br>");
    </script>
</body>
</html>
