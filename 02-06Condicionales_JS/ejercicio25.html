<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 25</title>
</head>
<body>
    <script>
        var dia = Number(prompt("Introduce un número del 1 al 7:"));

        switch (dia) {
            case 1:
                document.write("Lunes");
                break;
            case 2:
                document.write("Martes");
                break;
            case 3:
                document.write("Miércoles");
                break;
            case 4:
                document.write("Jueves");
                break;
            case 5:
                document.write("Viernes");
                break;
            case 6:
                document.write("Sábado");
                break;
            case 7:
                document.write("Domingo");
                break;
            default:
                document.write("Número no válido.");
        }
    </script>
</body>
</html>
