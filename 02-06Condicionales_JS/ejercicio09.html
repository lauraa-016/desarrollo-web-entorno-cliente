<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 9</title>
</head>
<body>
    <script>
        var num1 = Number(prompt("Introduce el primer número:"));
        var num2 = Number(prompt("Introduce el segundo número:"));

        if (num1 < num2) {
            document.write("El menor es " + num1);
        } else {
            document.write("El menor es " + num2);
        }
    </script>
</body>
</html>
