<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 26</title>
</head>
<body>
    <script>
        var num1 = Number(prompt("Introduce el primer número:"));
        var num2 = Number(prompt("Introduce el segundo número:"));
        var operacion = prompt("Introduce una operación (+, -, *, /):");

        var resultado;

        switch (operacion) {
            case "+":
                resultado = num1 + num2;
                break;

            case "-":
                resultado = num1 - num2;
                break;

            case "*":
                resultado = num1 * num2;
                break;

            case "/":
                if (num2 == 0) {
                    resultado = "No se puede dividir entre cero.";
                } else {
                    resultado = num1 / num2;
                }
                break;

            default:
                resultado = "Operación no válida.";
        }

        document.write("Resultado: " + resultado);
    </script>
</body>
</html>
