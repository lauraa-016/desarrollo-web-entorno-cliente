<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 15</title>
</head>
<body>
    <script>
        var letra = prompt("Introduce una letra:").toLowerCase();

        if (letra.length != 1) {
            document.write("No se puede procesar el dato.");
        } else if (
            letra == "a" ||
            letra == "e" ||
            letra == "i" ||
            letra == "o" ||
            letra == "u"
        ) {
            document.write("es vocal");
        } else {
            document.write("No es vocal.");
        }
    </script>
</body>
</html>
