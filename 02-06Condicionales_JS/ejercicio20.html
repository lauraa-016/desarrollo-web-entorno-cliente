<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 20</title>
</head>
<body>
    <script>
        var num1 = Number(prompt("Introduce el primer número:"));
        var num2 = Number(prompt("Introduce el segundo número:"));

        var resultado = num1 > num2
            ? "El mayor es " + num1
            : num2 > num1
                ? "El mayor es " + num2
                : "Los dos números son iguales.";

        document.write(resultado);
    </script>
</body>
</html>
