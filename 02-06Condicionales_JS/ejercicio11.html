<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11</title>
</head>
<body>
    <script>
        var dia = prompt("Introduce un día de la semana:").toLowerCase();

        if (dia == "lunes") {
            document.write("Hoy es lunes.");
        } else if (dia == "viernes") {
            document.write("¡Ya es viernes!");
        } else if (dia == "sábado" || dia == "sabado" || dia == "domingo") {
            document.write("¡Es fin de semana!");
        } else {
            document.write("Es un día entre semana.");
        }
    </script>
</body>
</html>
