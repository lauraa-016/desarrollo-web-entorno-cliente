<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 17</title>
</head>
<body>
    <script>
        var candidato = prompt("Elige un candidato: A, B o C").toUpperCase();

        switch (candidato) {
            case "A":
                document.write("Usted ha votado por el partido rojo");
                break;

            case "B":
                document.write("Usted ha votado por el partido verde");
                break;

            case "C":
                document.write("Usted ha votado por el partido azul");
                break;

            default:
                document.write("Opción errónea");
        }
    </script>
</body>
</html>
