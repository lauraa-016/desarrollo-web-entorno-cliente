<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 12</title>
</head>
<body>
    <script>
        var numero = Number(prompt("Introduce un número entero:"));

        if (numero < 0) {
            numero = numero * -1;
        }

        document.write("El valor absoluto es " + numero);
    </script>
</body>
</html>
