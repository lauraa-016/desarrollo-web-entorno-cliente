<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6</title>
</head>
<body>
    <script>
        var anio = Number(prompt("Introduce un año:"));

        if (anio % 4 == 0) {
            document.write("El año es bisiesto.");
        } else {
            document.write("El año no es bisiesto.");
        }
    </script>
</body>
</html>
