<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 23</title>
</head>
<body>
    <script>
        var numero = Number(prompt("Introduce un número:"));

        if (numero > 0) {
            document.write("El número es positivo.");
        } else if (numero < 0) {
            document.write("El número es negativo.");
        } else {
            document.write("El número es cero.");
        }
    </script>
</body>
</html>
