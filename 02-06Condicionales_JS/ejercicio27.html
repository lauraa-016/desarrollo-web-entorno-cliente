<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 27</title>
</head>
<body>
    <script>
        var color = prompt("Introduce un color: rojo, amarillo o verde.")
            .toLowerCase();

        switch (color) {
            case "rojo":
                document.write("Detente");
                break;

            case "amarillo":
                document.write("Precaución");
                break;

            case "verde":
                document.write("Avanza");
                break;

            default:
                document.write("Color no válido.");
        }
    </script>
</body>
</html>
